[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-agents-sdk"
version = "2.0.1"
description = "NEXUS AGENTS CRYPTO PROTOCOL — Homologated Python SDK v2.0.1 for Autonomous AI Agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Nexus Protocol", email = "contact@nexusprotocol.io" }
]
dependencies = [
    "cryptography>=41.0.0",
]
keywords = [
    "ai-agents",
    "cryptography",
    "ed25519",
    "x25519",
    "rfc8785",
    "jcs",
    "mcp",
    "settlement",
    "web3"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/brlukera/nexus-agents-sdk"
Repository = "https://github.com/brlukera/nexus-agents-sdk.git"
Issues = "https://github.com/brlukera/nexus-agents-sdk/issues"

[project.scripts]
nexus-mcp = "nexus_mcp_server:main"

[tool.setuptools]
py-modules = ["nexus_sdk", "nexus_mcp_server"]
